[project]
name = "reco"
version = "0.3.0"
description = "냉장고(보유 재료) 기반 개인화 레시피 추천 — AI 파트"
requires-python = ">=3.12,<3.13"

# ─────────────────────────────────────────────────────────────
# 🔴 여기 있는 것은 **전부 실제로 import 된다.** 안 쓰는 것을 넣지 않는다.
#    설치는 되는데 아무도 안 부르는 의존은 나중에 "왜 있지" 로 남는다.
# ─────────────────────────────────────────────────────────────
dependencies = [
    "pydantic>=2.9",          # 계약 76건이 이 위에서 돈다
    "pyyaml>=6.0",            # seeds/*.yaml
    "psycopg2-binary>=2.9",   # app/db · scripts/load_recipes.py · infra
]

[project.optional-dependencies]
# 추천 API 서버 (reco-api). 트랙 B
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

# 대시보드 (infra/app). 트랙 C — 01 3-2 에서 Streamlit 확정
# 🔴 pandas 를 넣지 않는다. st.dataframe 은 dict 리스트를 그대로 받고,
#    화면에 띄울 것이 요청 1건의 후보 20개 수준이라 할 일이 없다.
#    DataFrame 라이브러리는 로그가 커진 뒤에 본다 (docs/draft/기술스택.md Roadmap).
dash = [
    "streamlit>=1.40",
]

# 실험 추적. `make mlflow-ui` 가 이것을 부른다
# 🔴 지금 미설치라 `make mlflow-ui` 가 깨진다 (09-02 확인)
obs = [
    "mlflow>=2.17",
]

# 피처·평가 계산. 트랙 A/C
ml = [
    "numpy>=2.0",
    # C-3 이 평가 지표를 **외부 기준과 대조**할 때 쓴다.
    # 우리 nDCG 구현이 맞는지 확인할 유일한 바깥 잣대다.
    "scikit-learn>=1.5",
]

# 랭킹 v1. 🔴 W6 말 컷라인(누적 그룹 ≥ 500) 통과 시에만 깐다.
#    안 쓸 가능성이 실제로 있어서 기본에 넣지 않는다 —
#    유저를 못 모으면 v0 선형으로 마무리한다.
rank-v1 = [
    "lightgbm>=4.5",
]

# ⬜ 임베딩. **이번 3주에는 쓰지 않는다.**
#    A-12 가 ko-SBERT 대신 "TF-IDF → SVD 48차" 싼 버전으로 확정됐다 —
#    content_emb 를 만드는 코드가 없고 배치가 3주에 안 들어가기 때문이다.
#    나중에 content_emb 판으로 갈 때 이 묶음을 깐다.
embed = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12",           # fastapi.testclient — make contract 종단 검증
]

# ─────────────────────────────────────────────────────────────
# uv
# ─────────────────────────────────────────────────────────────
[tool.uv]
# 기본으로 깔 것. 트랙별 추가는 --extra 로 한다.
default-groups = ["dev"]

[tool.uv.sources]
# (없음)

# ─────────────────────────────────────────────────────────────
# 이 저장소는 패키지가 아니라 애플리케이션이다.
# 빌드/설치 대상이 아니므로 build-system 을 두지 않는다.
# uv 는 `tool.uv.package = false` 로 그것을 안다.
# ─────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = []
